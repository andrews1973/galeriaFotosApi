<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de fotos API</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Galería de fotos API</h1>
    </header>

    <main>

        <!-- MENÚ DE BÚSQUEDA Y SELECTORES -->
        <section id="menuSelectores" class="menuSelectores">

            <form id="busqueda">
                <input type="text" name="buscar" id="buscar" placeholder="Busca tu foto">

                <button type="submit">Buscar</button>
            </form>

            <button type="button" id="mostrarFavoritos">Mostrar Favoritos</button>

            <label for="orientacionFoto">Filtro por orientación</label>

            <select name="orientacionFoto" id="orientacionFoto">
                <option value="" selected disabled>Selecciona una opción</option>
                <option value="squarish">Cuadradas</option>
                <option value="portrait">Verticales</option>
                <option value="landscape">Horizontales</option>
            </select>

        </section>

        <!-- SECCIÓN DE COLECCIONES -->
        <section id="seccionColecciones">

            <h2 class="tituloSeccion">Explora nuestras colecciones</h2>

            <div id="categoria" class="categoria">

            </div>

        </section>

        <!-- SECCIÓN DE FOTOGRAFÍAS -->
        <section id="seccionFotografias">

            <h2 class="tituloSeccion">Descubre nuestras fotografías</h2>

            <div id="gridFotosCategoria" class="gridFotosCategoria orientacion-horizontal">

            </div>

        </section>

        <section id="modalFavoritos" class="modalFavoritos ocultar">

            <button type="button" id="cerrarFavoritos" aria-label="Cerrar favoritos">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <h2>Mis favoritos</h2>

            <div id="listaFavoritos"></div>

        </section>

    </main>

    <footer class="full-container">
        <p>&copy; 2026 Team Hero Bootcamp</p>
    </footer>

    <script src="js/main.js"></script>

</body>

</html>
